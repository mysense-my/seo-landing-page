<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="seo-css">
:root{
  
  --navy:#001B76;
  --blue:#0030B0;
  --pink:#F24277;
  --purple:#6C00D7;
  --yellow:#FFCC00;
  --cyan:#41CEE2;
  --page:#F1F3FA;
  --ink:#0B1339;
  --white:#fff;

  
  --blue-lite:#2E5BE0;        
  --blue-deep:#001F82;
  --navy-deep:#00114D;
  --cyan-deep:#1FA8BC;
  --cyan-soft:#D8F4F8;
  --ink-2:#1B2450;
  --line:rgba(11,19,57,.10);
  --line-on-dark:rgba(255,255,255,.16);
  --muted:#454D68;            
  --muted-2:#818AA7;          
  --muted-on-dark:rgba(255,255,255,.78);

  
  --grad-climb:linear-gradient(118deg,var(--navy) 0%,var(--blue) 46%,var(--cyan-deep) 100%);
  --grad-climb-soft:linear-gradient(118deg,#001B76 0%,#0030B0 55%,#2C97AB 120%);
  --grad-line:linear-gradient(90deg,var(--cyan),var(--blue),var(--pink));

  
  
  --ff-display:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  
  --r-pill:999px;
  --r-card:24px;
  --r-panel:32px;
  --r-input:14px;
  --r-chip:18px;

  
  --sh-chip:24px 24px 40px rgba(0,27,118,.26);
  --sh-card:0 10px 34px rgba(11,19,57,.08);
  --sh-lift:0 26px 56px rgba(0,27,118,.16);
  --sh-deck:0 30px 70px rgba(11,19,57,.28);

  
  --container:1308px;
  --gutter:clamp(20px,5vw,66px);
  --sec-y:clamp(72px,9vw,132px);

  
  --ease:cubic-bezier(0.16,1,0.3,1);
  --ease-hover:cubic-bezier(0.44,0,0.56,1);
  --dur-reveal:1050ms;
  --dur-hover:400ms;
}
.seo,.seo *,.seo *::before,.seo *::after{box-sizing:border-box}
.seo{-webkit-text-size-adjust:100%}
.seo{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.seo img,.seo svg,.seo video{max-width:100%;height:auto;display:block}
.seo button{font:inherit;color:inherit}
.seo a{color:inherit;text-decoration:none}
.seo h1,.seo h2,.seo h3,.seo h4,.seo h5{
  font-family:var(--ff-display);
  font-weight:800;
  margin:0;
  letter-spacing:-.02em;
  line-height:1;
}
.seo p{margin:0}
.seo .wrap{
  width:100%;
  max-width:var(--container);
  margin-inline:auto;
  padding-inline:var(--gutter);
}
.seo .wrap--narrow{max-width:1020px}
.seo .section{padding-block:var(--sec-y)}
.seo .section--tight{padding-block:clamp(52px,6vw,86px)}
.seo .display{
  font-family:var(--ff-display);
  font-weight:800;
  text-transform:uppercase;
  font-size:clamp(32px,5vw,68px);
  line-height:1;
  letter-spacing:-.035em;
}
.seo .h2{
  font-family:var(--ff-display);
  font-weight:800;
  text-transform:uppercase;
  font-size:clamp(28px,3.6vw,50px);
  line-height:1.06;
  letter-spacing:-.025em;
}
.seo .h3{
  font-family:var(--ff-display);
  font-weight:800;
  font-size:clamp(18px,1.5vw,21px);
  line-height:1.18;
  letter-spacing:-.01em;
}
.seo .h4{
  font-family:var(--ff-display);
  font-weight:800;
  font-size:clamp(16px,1.2vw,18px);
  line-height:1.25;
  letter-spacing:-.01em;
}
.seo .lead{
  font-family:var(--body);
  font-weight:500;
  font-size:clamp(16px,1.35vw,19px);
  line-height:1.5;
}
.seo .body{font-size:16px;line-height:1.62;color:var(--muted)}
.seo .small{font-size:14px;line-height:1.5}
.seo .sechead{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:16px;max-width:820px;margin:0 auto clamp(38px,4.4vw,62px);
}
.seo .sechead--left{align-items:flex-start;text-align:left;margin-inline:0}
.seo .sechead__lede{font-size:clamp(16px,1.3vw,18px);line-height:1.6;color:var(--muted);max-width:64ch}
.seo .sechead--on-dark .sechead__lede{color:var(--muted-on-dark)}
.seo .sechead--on-dark .h2{color:#fff}
.seo .pill{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--body);font-weight:600;font-size:14px;
  padding:8px 16px;border-radius:var(--r-pill);
  background:rgba(0,48,176,.10);color:var(--blue);
  letter-spacing:0;text-transform:none;
}
.seo .pill--on-dark{background:rgba(255,255,255,.14);color:#fff}
.seo .pill--cyan{background:rgba(65,206,226,.18);color:#0E7A8B}
.seo .pill--pink{background:rgba(242,66,119,.12);color:#C4104A}
.seo .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--body);font-weight:700;font-size:16px;line-height:1;
  padding:18px 28px;border-radius:var(--r-pill);border:0;cursor:pointer;
  text-align:center;
  transition:transform var(--dur-hover) var(--ease),
             box-shadow var(--dur-hover) var(--ease),
             background-color var(--dur-hover) var(--ease-hover),
             color var(--dur-hover) var(--ease-hover);
}
.seo .btn:hover{transform:translateY(-2px)}
.seo .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.seo .btn--primary{background:var(--yellow);color:var(--ink);
  box-shadow:0 10px 26px rgba(255,204,0,.28)}
.seo .btn--primary:hover{background:#FFD633;box-shadow:0 16px 34px rgba(255,204,0,.36)}
.seo .btn--blue{background:var(--blue);color:#fff;
  box-shadow:0 10px 26px rgba(0,48,176,.24)}
.seo .btn--blue:hover{background:#0038CC;box-shadow:0 16px 34px rgba(0,48,176,.30)}
.seo .btn--ghost-dark{
  background:transparent;color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42);
}
.seo .btn--ghost-dark:hover{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1.5px #fff}
.seo .btn--ghost{
  background:transparent;color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--line);
}
.seo .btn--ghost:hover{background:#fff;box-shadow:inset 0 0 0 1.5px rgba(11,19,57,.24)}
.seo .btn--sm{padding:13px 22px;font-size:14px}
.seo .iconbtn{
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid var(--line);background:transparent;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  transition:background-color var(--dur-hover) var(--ease-hover),
             color var(--dur-hover) var(--ease-hover),
             border-color var(--dur-hover) var(--ease-hover);
}
.seo .iconbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.seo .iconbtn--on-dark{border-color:var(--line-on-dark);color:#fff}
.seo .iconbtn--on-dark:hover{background:#fff;color:var(--navy);border-color:#fff}
.seo .sec-cta{display:flex;justify-content:center;margin-top:clamp(34px,4vw,54px)}
.seo .sec-cta--left{justify-content:flex-start}
.seo [data-reveal]{
  opacity:0;transform:translateY(40px);
  transition:opacity var(--dur-reveal) var(--ease),
             transform var(--dur-reveal) var(--ease);
}
.seo [data-reveal].is-in{opacity:1;transform:none}
.seo [data-pop]{
  opacity:0;transform:scale(.72);
  transition:opacity 700ms var(--ease),transform 700ms var(--ease);
}
.seo [data-pop].is-in{opacity:1;transform:none}
.seo [data-float]{transform:translateY(var(--float-y,0));will-change:transform}
.seo .visually-hidden{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion:reduce){.seo,.seo *,.seo *::before,.seo *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
.seo [data-reveal],.seo [data-pop]{opacity:1!important;transform:none!important}
.seo [data-float]{transform:none!important}}
.seo .hero{
  position:relative;
  isolation:isolate;
  background:var(--grad-climb);
  color:#fff;
  padding-top:clamp(112px,10vw,176px);
  padding-bottom:clamp(72px,8vw,116px);
  overflow:hidden;
}
.seo .hero__bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.seo .hero__bg svg{
  position:absolute;inset:0;
  width:100%;height:100%;max-width:none;
  display:block;
}
.seo .hero::before{
  content:'';position:absolute;inset:0 0 auto;height:220px;z-index:-1;
  background:linear-gradient(180deg,rgba(0,17,77,.55),transparent);
  pointer-events:none;
}
.seo .hero__inner{
  display:grid;
  grid-template-columns:1.02fr .98fr;
  gap:clamp(28px,4vw,64px);
  align-items:center;
  min-height:min(78vh,760px);
}
.seo .hero__inner > *{min-width:0}
.seo .hero__copy{display:flex;flex-direction:column;align-items:flex-start}
.seo .hero__badge{margin-bottom:22px}
.seo .hero__title{margin:0 0 20px}
.seo .hero__title .line{display:block}
.seo .hero__sub{color:var(--muted-on-dark);max-width:36ch;margin-bottom:26px}
.seo .hero__checks{
  list-style:none;margin:0 0 32px;padding:0;
  display:flex;flex-direction:column;gap:11px;
}
.seo .hero__checks li{
  position:relative;padding-left:30px;
  font-size:15px;font-weight:600;color:rgba(255,255,255,.94);
}
.seo .hero__checks li::before{
  content:'';position:absolute;left:0;top:2px;
  width:19px;height:19px;border-radius:50%;
  background:var(--yellow);
}
.seo .hero__checks li::after{
  content:'';position:absolute;left:5.5px;top:8px;
  width:8px;height:4px;
  border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(-45deg);
}
.seo .hero__cta{display:flex;flex-wrap:wrap;gap:14px}
.seo .hero__reply{margin-top:16px;font-size:14px;font-weight:500;color:rgba(255,255,255,.58)}
.seo .hero__title .line:last-child{position:relative;display:inline-block}
.seo .hero__rule{
  position:absolute;left:0;right:-2%;bottom:-.14em;
  width:104%;height:auto;max-width:none;
  pointer-events:none;
}
.seo .hero__stage{position:relative;padding-block:34px}
.seo .stage{
  background:#fff;
  border-radius:26px;
  
  padding:clamp(15px,1.5vw,19px) clamp(15px,1.6vw,20px) clamp(40px,3.8vw,46px);
  box-shadow:0 40px 90px rgba(0,17,77,.42);
  color:var(--ink);
  max-width:516px;margin-inline:auto;
}
.seo .srch{
  display:flex;align-items:center;gap:11px;
  background:#fff;
  border:1px solid rgba(11,19,57,.14);
  border-radius:var(--r-pill);
  box-shadow:0 1px 5px rgba(11,19,57,.07);
  padding:11px 15px;
}
.seo .srch__glass{color:var(--muted-2);display:flex;flex:0 0 auto}
.seo .srch__q{
  font-size:15.5px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;min-width:0;flex:1 1 auto;
  white-space:nowrap;overflow:hidden;
}
.seo .srch__caret{
  display:inline-block;width:1.5px;height:17px;margin-left:2px;
  background:var(--ink);border-radius:1px;flex:0 0 auto;
  animation:caret 1.05s steps(1) infinite;
}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.seo .srch__tools{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.seo .srch__x{color:var(--muted-2);display:flex}
.seo .srch__div{width:1px;height:19px;background:rgba(11,19,57,.14);display:block}
.seo .srch__mic{color:var(--blue);display:flex}
.seo .tabs{
  display:flex;align-items:center;gap:clamp(14px,2vw,24px);
  margin-top:13px;padding:0 4px;
  border-bottom:1px solid rgba(11,19,57,.09);
}
.seo .tabs__t{
  font-size:12.5px;font-weight:500;color:var(--muted);
  padding-bottom:9px;position:relative;white-space:nowrap;
}
.seo .tabs__t.is-on{color:var(--blue);font-weight:700}
.seo .tabs__t.is-on::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;
  background:var(--blue);border-radius:2px 2px 0 0;
}
.seo .stage__meta{
  font-size:11.5px;font-weight:400;color:var(--muted-2);
  padding:0 4px;margin:11px 0 0;
}
.seo .stage__meta b{font-weight:400}
.seo .res{list-style:none;margin:16px 0 0;padding:0 4px}
.seo .res__i{
  display:flex;flex-direction:column;
  opacity:1;transform:none;
  transition:opacity .34s var(--ease),transform .34s var(--ease);
}
.seo .res__i + .res__i{margin-top:19px}
.seo .res__site{display:flex;align-items:center;gap:9px;min-width:0}
.seo .res__fav{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;
  display:grid;place-items:center;
  background:#EDEFF6;color:var(--muted-2);
  font-family:var(--ff-display);font-weight:800;font-size:10.5px;
}
.seo .res__fav--me{background:var(--grad-climb-soft);color:#fff}
.seo .res__id{display:flex;flex-direction:column;gap:1px;min-width:0}
.seo .res__host{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25}
.seo .res__url{
  font-size:11.5px;color:var(--muted-2);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seo .res__url i{font-style:normal;padding:0 4px}
.seo .res__t{
  margin-top:5px;
  font-size:15.5px;font-weight:600;color:var(--blue);
  line-height:1.3;letter-spacing:-.005em;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.seo .res__s{
  margin-top:3px;
  font-size:12.5px;line-height:1.5;color:var(--muted);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.seo .res__s b{font-weight:700;color:var(--ink-2)}
.seo .stage__meta{transition:opacity .26s var(--ease),transform .26s var(--ease)}
.seo .res__i:nth-child(2){transition-delay:70ms}
.seo .res__i:nth-child(3){transition-delay:140ms}
.seo .stage.is-swapping .stage__meta,.seo .stage.is-swapping .res__i{
  opacity:0;transform:translateY(8px);
  transition-duration:.2s;transition-delay:0ms;
}
.seo .chip{
  position:absolute;
  background:#fff;color:var(--ink);
  border-radius:var(--r-chip);
  padding:14px 18px;
  box-shadow:var(--sh-chip);
  display:flex;flex-direction:column;gap:2px;
  transform:translateY(var(--float-y,0));
  max-width:200px;
}
.seo .chip__n{
  font-family:var(--ff-display);font-weight:900;font-size:24px;
  letter-spacing:-.03em;line-height:1;color:var(--blue);
}
.seo .chip__l{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.35}
.seo .chip--a{left:-30px;top:-34px}
.seo .chip--b{right:-26px;bottom:-30px}
.seo .chip--b .chip__n{color:var(--pink)}
@media (max-width:1100px){.seo .chip--a{left:-12px}
.seo .chip--b{right:-10px}}
@media (max-width:940px){.seo .hero__inner{grid-template-columns:1fr;gap:44px;min-height:0}
.seo .hero__copy{align-items:flex-start}
.seo .hero__sub{max-width:52ch}
.seo .hero__stage{max-width:560px;margin-inline:auto;width:100%}
.seo .chip--a{left:-6px;top:-30px}
.seo .chip--b{right:-6px;bottom:-26px}}
@media (max-width:600px){.seo .stage{padding:13px 13px 30px;border-radius:22px}
.seo .srch{padding:9px 12px}
.seo .srch__q{font-size:14.5px}
.seo .tabs{gap:14px;margin-top:11px}
.seo .tabs__t{font-size:12px;padding-bottom:8px}
.seo .stage__meta{margin-top:9px}
.seo .res{margin-top:13px}
.seo .res__i:nth-child(3){display:none}
.seo .res__i + .res__i{margin-top:14px}
.seo .res__fav{width:21px;height:21px;font-size:10px}
.seo .res__host{font-size:12px}
.seo .res__url{font-size:11px}
.seo .res__t{font-size:14px}
.seo .res__s{font-size:11.5px}
.seo .chip{padding:11px 13px;max-width:154px;border-radius:14px}
.seo .chip__n{font-size:19px}
.seo .chip__l{font-size:10.5px}
.seo .chip--a{left:-4px;top:-24px}
.seo .chip--b{right:-4px;bottom:-22px}
.seo .hero__cta{width:100%}
.seo .hero__cta .btn{flex:1 1 auto}}
@media (max-width:380px){.seo .chip--a,.seo .chip--b{display:none}}
.seo .brands{background:var(--page);position:relative;overflow:hidden}
.seo .brands::before,.seo .brands::after{
  content:'';position:absolute;width:520px;height:520px;border-radius:50%;
  pointer-events:none;z-index:0;
}
.seo .brands::before{left:-220px;top:-260px;background:radial-gradient(circle,rgba(0,48,176,.10),transparent 68%)}
.seo .brands::after{right:-240px;bottom:-300px;background:radial-gradient(circle,rgba(65,206,226,.20),transparent 68%)}
.seo .brands > *{position:relative;z-index:1}
.seo .logorail{
  display:flex;flex-direction:column;gap:clamp(12px,1.4vw,18px);
  margin-block:clamp(6px,1vw,14px);
  
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
}
.seo .logorail__rail{display:flex;width:max-content;transform:translateX(var(--marquee-x,0))}
.seo .logorail__set{display:flex;align-items:center;gap:clamp(12px,1.4vw,18px);padding-right:clamp(12px,1.4vw,18px)}
.seo .logocell{
  flex:0 0 auto;
  width:clamp(140px,14vw,200px);height:clamp(72px,7.4vw,104px);
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;padding:0;
}
.seo .logocell img{
  width:100%;height:100%;min-width:0;min-height:0;
  object-fit:contain;
}
.seo .logocell--ink img{filter:brightness(0);opacity:.82}
.seo .awards{
  margin:clamp(30px,3.6vw,48px) auto 0;
  max-width:940px;
  background:var(--grad-climb-soft);
  border-radius:var(--r-panel);
  padding:clamp(24px,3vw,38px) clamp(22px,3vw,40px);
  box-shadow:0 26px 60px rgba(0,27,118,.24);
  display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(22px,3vw,44px);
  position:relative;overflow:hidden;
}
.seo .awards::before{
  content:'';position:absolute;right:-140px;top:-180px;
  width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(65,206,226,.30),transparent 68%);
  pointer-events:none;
}
.seo .award{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:clamp(16px,2vw,26px);
}
.seo .award + .award{
  border-left:1px solid rgba(255,255,255,.18);
  padding-left:clamp(22px,3vw,44px);
}
.seo .award__mark{flex:0 0 auto;display:grid;place-items:center}
.seo .award__mark img{width:auto;object-fit:contain}
.seo .award__mark--trophy img{height:clamp(78px,7.6vw,104px)}
.seo .award__mark--mbor img{height:clamp(52px,5.2vw,70px)}
.seo .award__text{min-width:0}
.seo .award__t{
  font-family:var(--ff-display);font-weight:800;
  font-size:clamp(15px,1.3vw,17.5px);line-height:1.2;letter-spacing:-.015em;
  color:#fff;margin:0 0 6px;
}
.seo .award__t:last-child{margin-bottom:0}

  border-radius:26px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.15);
  overflow:hidden;
  --cols:.8fr 1.05fr 1.5fr;
}
.seo .cmp__head,.seo .cmp__row{
  display:grid;grid-template-columns:var(--cols);align-items:stretch;
}
.seo .cmp__row{
  opacity:0;transform:translateY(22px);
  transition:opacity .7s var(--ease),transform .7s var(--ease);
}
.seo .cmp__row.is-in{opacity:1;transform:none}
.seo .cmp__c{
  padding:clamp(18px,1.9vw,26px) clamp(16px,1.6vw,24px);
  font-size:14.5px;line-height:1.55;
  display:flex;align-items:flex-start;gap:10px;
  border-top:1px solid rgba(255,255,255,.10);
  transition:background .4s var(--ease),color .4s var(--ease);
}
.seo .cmp__head .cmp__c{border-top:0}
.seo .cmp__c--lbl{
  font-family:var(--ff-display);font-weight:800;font-size:14.5px;
  letter-spacing:-.01em;color:rgba(255,255,255,.94);
  background:rgba(0,0,0,.20);
  align-items:center;
}
.seo .cmp__c--them{color:rgba(255,255,255,.66);background:rgba(0,0,0,.10)}
.seo .cmp__c--us{
  color:#fff;font-weight:600;
  background:linear-gradient(180deg,rgba(0,48,176,.72),rgba(31,168,188,.30));
  box-shadow:inset 4px 0 0 var(--cyan), -30px 0 50px rgba(0,10,45,.45);
  position:relative;overflow:hidden;
}
.seo .cmp__c--us::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 32%,rgba(255,255,255,.20) 50%,transparent 68%);
  transform:translateX(-70%);opacity:0;
  transition:transform 1s var(--ease),opacity .3s var(--ease);
}
.seo .cmp__row.is-hot .cmp__c--us::after{opacity:1;transform:translateX(70%)}
.seo .cmp__head .cmp__c{
  padding-block:clamp(15px,1.5vw,19px);
  font-family:var(--ff-display);font-weight:800;
  font-size:clamp(13.5px,1.15vw,16px);
  text-transform:none;letter-spacing:-.01em;
  align-items:center;
}
.seo .cmp__head .cmp__c--them{background:rgba(0,0,0,.18);color:rgba(255,255,255,.62)}
.seo .cmp__head .cmp__c--us{
  background:linear-gradient(120deg,var(--blue),var(--cyan-deep));
  color:#fff;flex-direction:column;align-items:flex-start;gap:4px;
  padding-block:clamp(17px,1.8vw,23px);
}
.seo .cmp__flag{
  font-family:var(--body);font-style:normal;font-weight:600;font-size:12px;
  color:rgba(255,255,255,.86);
}
.seo .cmp__x,.seo .cmp__v{flex:0 0 auto;width:21px;height:21px;border-radius:50%;position:relative;margin-top:1px}
.seo .cmp__x{background:rgba(255,255,255,.13)}
.seo .cmp__x::before,.seo .cmp__x::after{
  content:'';position:absolute;left:50%;top:50%;width:9px;height:1.8px;border-radius:2px;
  background:rgba(255,255,255,.62);
}
.seo .cmp__x::before{transform:translate(-50%,-50%) rotate(45deg)}
.seo .cmp__x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.seo .cmp__v{background:var(--yellow)}
.seo .cmp__v::after{
  content:'';position:absolute;left:6px;top:6.5px;width:9px;height:4.5px;
  border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(-45deg);
}
.seo .cmp.is-focusing .cmp__row{opacity:.40}
.seo .cmp.is-focusing .cmp__row.is-hot{opacity:1}
.seo .cmp__row.is-hot .cmp__c--us{
  background:linear-gradient(180deg,rgba(0,48,176,.85),rgba(31,168,188,.55));
  box-shadow:inset 3px 0 0 var(--yellow), -26px 0 50px rgba(0,10,45,.44);
}
.seo .cmp__row.is-hot .cmp__c--lbl{background:rgba(0,0,0,.24);color:#fff}
.seo .method__close{
  text-align:center;
  margin:clamp(24px,3vw,36px) auto 0;max-width:44ch;
  font-family:var(--ff-display);font-weight:800;
  font-size:clamp(17px,1.7vw,23px);letter-spacing:-.02em;line-height:1.25;
  color:#fff;
}
.seo .method__close em{font-style:normal;color:var(--yellow)}
@media (max-width:860px){.seo .cmp{background:none;border:0;gap:12px;overflow:visible}
.seo .cmp__head{display:none}
.seo .cmp__row{
    grid-template-columns:1fr;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;overflow:hidden;
  }
.seo .cmp__c{border-top:0}
.seo .cmp__c--lbl{
    background:rgba(0,0,0,.20);font-size:15px;
    padding-block:14px;
  }
.seo .cmp__c--them,.seo .cmp__c--us{flex-direction:column;gap:6px;position:relative;padding-left:clamp(16px,4vw,22px)}
.seo .cmp__c--them::before,.seo .cmp__c--us::before{
    font-family:var(--body);font-weight:700;font-size:11.5px;
  }
.seo .cmp__c--them::before{content:'The usual approach';color:rgba(255,255,255,.5)}
.seo .cmp__c--us::before{content:'MYSense';color:var(--cyan)}
.seo .cmp__c--us{box-shadow:inset 0 3px 0 var(--cyan)}
.seo .cmp__x,.seo .cmp__v{display:none}
.seo .cmp.is-focusing .cmp__row{opacity:1}}
.seo .offers{background:var(--page)}
.seo .slats{
  display:flex;gap:clamp(10px,1.2vw,16px);
  height:clamp(380px,42vw,540px);
}
.seo .slat{
  position:relative;isolation:isolate;
  flex:1 1 0;min-width:0;
  border-radius:var(--r-panel);
  overflow:hidden;
  background:var(--navy-deep);
  transition:flex-grow .66s var(--ease),box-shadow .5s var(--ease);
}
.seo .slat.is-open{flex-grow:3.4;box-shadow:var(--sh-lift)}
.seo .slat__img{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.04);
  transition:transform 1.1s var(--ease);
}
.seo .slat.is-open .slat__img{transform:scale(1)}
.seo .slat::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,27,118,.72) 0%,rgba(0,17,77,.66) 40%,rgba(0,17,77,.96) 100%);
  transition:background .6s var(--ease);
}
.seo .slat.is-open::before{
  background:linear-gradient(180deg,rgba(0,27,118,.22) 0%,rgba(0,17,77,.44) 42%,rgba(0,17,77,.95) 100%);
}
.seo .slat__hit{
  position:absolute;inset:0;z-index:4;
  background:none;border:0;padding:0;cursor:pointer;
  
  border-radius:inherit;
}
.seo .slat__hit:focus-visible{outline:3px solid var(--cyan);outline-offset:-6px;border-radius:inherit}
.seo .slat__spine{
  position:absolute;left:0;bottom:0;z-index:3;
  padding:clamp(16px,1.7vw,24px);
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:var(--ff-display);font-weight:800;
  font-size:clamp(14px,1.15vw,17px);letter-spacing:-.01em;line-height:1;
  color:#fff;white-space:nowrap;pointer-events:none;
  transition:opacity .3s var(--ease);
}
.seo .slat.is-open .slat__spine{opacity:0}
.seo .slat__face{
  position:absolute;inset:auto 0 0 0;z-index:3;
  padding:clamp(16px,1.7vw,26px);
  display:flex;flex-direction:column;gap:10px;
  pointer-events:none;
  opacity:0;transform:translateY(10px);
  transition:opacity .38s var(--ease),transform .55s var(--ease);
}
.seo .slat.is-open .slat__face{opacity:1;transform:none}
.seo .slat__face::before{
  content:'';display:block;height:3px;width:26px;border-radius:2px;
  background:var(--grad-line);
  transition:width .6s var(--ease);
}
.seo .slat.is-open .slat__face::before{width:78px}
.seo .slat__t{color:#fff;letter-spacing:-.015em}
.seo .slat__b{
  font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.88);
  max-width:46ch;
  max-height:0;opacity:0;overflow:hidden;
  transform:translateY(12px);
  transition:max-height .62s var(--ease),opacity .42s .1s var(--ease),
             transform .62s var(--ease);
}
.seo .slat.is-open .slat__b{max-height:20em;opacity:1;transform:none}
.seo .slat__tap{
  display:none;align-self:flex-start;
  font-size:12px;font-weight:700;color:var(--ink);
  background:var(--yellow);border-radius:var(--r-pill);padding:6px 12px;
}
.is-touch .seo .slat__tap{display:inline-block}
.is-touch .seo .slat.is-open .slat__tap{display:none}
@media (min-width:1025px){.seo .slat__b{max-height:none;opacity:1;transform:none;transition:none}}
@media (max-width:1024px){.seo .slat__spine{display:none}
.seo .slat__face{opacity:1;transform:none}
.seo .slats{
    flex-direction:column;height:auto;
    gap:clamp(10px,1.4vw,14px);
  }
.seo .slat{
    flex:0 0 auto;height:104px;
    transition:height .6s var(--ease),box-shadow .5s var(--ease);
  }
.seo .slat.is-open{height:min(430px,66vw);flex-grow:0}
.seo .slat__face{padding:18px 20px}
.seo .slat__b{max-width:none}}
@media (max-width:560px){.seo .slat{height:96px}
.seo .slat.is-open{height:400px}}
.seo .site-head{
  position:fixed;top:0;left:0;right:0;z-index:60;
  padding-block:clamp(14px,1.6vw,22px);
  transition:background .32s var(--ease),box-shadow .32s var(--ease),
             padding .32s var(--ease);
}
.seo .site-head.is-stuck{
  background:rgba(0,17,77,.84);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,27,118,.30);
  padding-block:clamp(10px,1.1vw,14px);
}
.seo .site-head__inner{display:flex;align-items:center;gap:clamp(16px,2.4vw,40px)}
.seo .site-head__logo{flex:0 0 auto;display:block}
.seo .site-head__logo img{width:auto;height:clamp(30px,3.2vw,42px);display:block}
.seo .site-nav{
  display:flex;align-items:center;gap:clamp(16px,2vw,30px);
  margin-left:auto;
}
.seo .site-nav a{
  color:#fff;font-weight:600;font-size:15px;text-decoration:none;
  position:relative;padding-block:6px;
}
.seo .site-nav a::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--yellow);border-radius:2px;
  transform:scaleX(0);transform-origin:left;
  transition:transform .28s var(--ease);
}
.seo .site-nav a:hover::after,.seo .site-nav a:focus-visible::after{transform:scaleX(1)}
.seo .btn--dark{background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:9px}
.seo .btn--dark:hover{background:#000}
.seo .site-head__cta{flex:0 0 auto;padding:12px 22px;font-size:14px}
.seo .site-head__burger{
  display:none;flex-direction:column;justify-content:center;gap:5px;
  width:44px;height:44px;padding:0 10px;flex:0 0 auto;
  background:rgba(255,255,255,.14);border:0;border-radius:12px;cursor:pointer;
}
.seo .site-head__burger span{
  display:block;height:2px;width:100%;background:#fff;border-radius:2px;
  transition:transform .3s var(--ease),opacity .2s var(--ease);
}
.seo .site-head__burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.seo .site-head__burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.seo .site-head__burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.seo .site-menu{
  display:none;position:fixed;inset:0;z-index:800;
  background:var(--navy);
  flex-direction:column;
  padding:14px clamp(20px,5vw,26px) calc(20px + env(safe-area-inset-bottom,0px));
}
.seo .site-menu[hidden]{display:none!important}
.seo .site-menu.is-open:not([hidden]){
  display:flex;
  animation:smflood .6s var(--ease) both;
}
@keyframes smflood{
  from{clip-path:circle(30px at calc(100% - 42px) 40px)}
  to{clip-path:circle(180% at calc(100% - 42px) 40px)}
}
.seo .site-menu__top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.seo .site-menu__logo{display:block;height:26px;width:auto}
.seo .site-menu__close{
  background:none;border:0;cursor:pointer;color:#fff;padding:12px 0 12px 16px;
  font-family:var(--ff-display);font-size:12px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;opacity:.85;transition:opacity .3s;
}
.seo .site-menu__close:hover{opacity:.5}
.seo .site-menu__links{display:flex;flex-direction:column;margin-top:30px}
.seo .site-menu__links a{
  color:#fff;font-family:var(--ff-display);font-weight:800;
  text-transform:uppercase;font-size:clamp(28px,7.4vw,56px);line-height:1.14;
  letter-spacing:-.02em;padding:2px 0;transition:opacity .3s;
  animation:smfade .45s var(--ease) both;
}
.seo .site-menu__links a:hover{opacity:.55}
.seo .site-menu__links a:nth-child(1){animation-delay:.16s}
.seo .site-menu__links a:nth-child(2){animation-delay:.22s}
.seo .site-menu__links a:nth-child(3){animation-delay:.28s}
.seo .site-menu__links a:nth-child(4){animation-delay:.34s}
.seo .site-menu__links a:nth-child(5){animation-delay:.40s}
@keyframes smfade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.seo .site-menu__foot{
  margin-top:auto;display:flex;align-items:flex-end;
  justify-content:space-between;gap:20px;padding-bottom:18px;
}
.seo .site-menu__label{
  color:rgba(255,255,255,.5);font-family:var(--ff-display);
  font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
}
.seo .site-menu__contact{display:flex;flex-direction:column;gap:7px;text-align:right}
.seo .site-menu__contact a{color:#fff;font-size:15px;font-weight:600;transition:opacity .3s}
.seo .site-menu__contact a:hover{opacity:.55}
.seo .site-menu__cta{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-top:1px solid rgba(255,255,255,.18);padding-top:18px;color:#fff;
  font-family:var(--ff-display);font-weight:800;text-transform:uppercase;
  font-size:clamp(16px,4.6vw,22px);letter-spacing:-.01em;transition:opacity .3s;
}
.seo .site-menu__cta:hover{opacity:.6}
.seo .site-menu__cta em{font-style:normal;font-size:1.2em;line-height:1}
@media (max-width:1024px){.seo .site-head__burger{display:flex;margin-left:auto}
.seo .site-head__cta{display:none}
.seo .site-nav{display:none}}
@media (min-width:1025px){.seo .site-menu{display:none!important}}
.seo .site-foot{
  background:#fff;color:var(--ink);
  padding-block:clamp(56px,7vw,104px) clamp(26px,3vw,40px);
  border-top:1px solid var(--line);
  position:relative;overflow:hidden;
}
.seo .site-foot::before{
  content:'';position:absolute;left:-160px;bottom:-220px;
  width:620px;height:620px;border-radius:50%;

.seo .site-foot .wrap{position:relative;z-index:1}
.seo .foot__top{
  display:flex;flex-direction:row;align-items:flex-start;

}
.seo .foot__logo{display:inline-flex;align-items:center}
.seo .foot__logo img{display:block;height:clamp(34px,3.4vw,46px);width:auto}
.seo .foot__lead{display:flex;flex-direction:column;align-items:flex-start;max-width:640px}
.seo .foot__t{max-width:16ch;margin:0}
.seo .foot__t em{font-style:normal;background:linear-gradient(96deg,var(--blue),var(--cyan-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.seo .foot__cta{margin-top:clamp(24px,3vw,38px)}
.seo .foot__cols{
  display:grid;grid-template-columns:1.2fr 1.2fr .9fr;
  gap:clamp(24px,3.2vw,40px);
  margin-top:clamp(48px,6vw,76px);padding-top:clamp(30px,3.4vw,44px);
  border-top:1px solid var(--line);
}
.seo .foot__col{display:flex;flex-direction:column;align-items:flex-start;gap:11px}
.seo .foot__label{
  display:inline-block;padding:7px 14px;border-radius:var(--r-pill);
  background:rgba(11,19,57,.05);border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;
}
.seo .foot__big{
  font-size:clamp(17px,1.7vw,24px);font-weight:600;
  letter-spacing:-.03em;line-height:1.25;color:var(--ink);margin:0;
}
.seo .foot__note{font-size:15px;line-height:1.6;color:var(--muted);margin:0}
.seo .foot__col a{
  color:var(--muted);text-decoration:none;font-size:15px;
  transition:color .22s var(--ease);
}
.seo .foot__col a:hover,.seo .foot__col a:focus-visible{color:var(--blue)}
.seo .foot__end{
  display:flex;flex-direction:row;justify-content:space-between;
  gap:20px;flex-wrap:wrap;

  border-top:1px solid var(--line);
  font-size:13px;color:var(--muted-2);

@media (max-width:900px){.seo .foot__cols{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.seo .foot__cols{grid-template-columns:1fr}
.seo .foot__top{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.seo .site-head,.seo .site-nav{transition:none}}

/* ---- hold button styling through hover/focus/active (see build script) ---- */
.seo .acc__btn:hover,.seo .acc__btn:focus,.seo .acc__btn:focus-visible,.seo .acc__btn:active{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:none;border:0;cursor:pointer;text-align:left;
